apply plugin: 'jacoco'

jacoco {
    toolVersion = "${rootProject.ext.jacoco_version}"
}

project.afterEvaluate { project ->

    tasks.withType(Test).configureEach {
        jacoco.includeNoLocationClasses = true
        jacoco.excludes = ['jdk.internal.*']
    }

    final buildType = "Debug"
    final variant = buildType.toLowerCase()
    final taskName = "jacocoTest${buildType}UnitTestReport"

    task "$taskName"(type: JacocoReport, dependsOn: "test${buildType.capitalize()}UnitTest") {

        reports {
            csv.required = Boolean.FALSE
            xml.required = Boolean.TRUE
            html.required = Boolean.TRUE
        }

        final fileFilter = [
                // data binding
                '**/databinding/*',
                'android/databinding/**/*.class',
                '**/android/databinding/*Binding.class',
                '**/android/databinding/*',
                '**/androidx/databinding/*',
                '**/BR.*',
                // android
                '**/R.class',
                '**/R$*.class',
                '**/BuildConfig.*',
                '**/Manifest*.*',
                '**/*Test*.*',
                'android/**/*.*',
                // kotlin
                '**/*MapperImpl*.*',
                '**/*$ViewInjector*.*',
                '**/*$ViewBinder*.*',
                '**/BuildConfig.*',
                '**/*Component*.*',
                '**/*BR*.*',
                '**/Manifest*.*',
                '**/*$Lambda$*.*',
                '**/*Companion*.*',
                '**/*Module*.*',
                '**/*Dagger*.*',
                '**/*Hilt*.*',
                '**/*MembersInjector*.*',
                '**/*_MembersInjector.class',
                '**/*_Factory*.*',
                '**/*_Provide*Factory*.*',
                '**/*Extensions*.*',
                // sealed and data classes
                '**/*$Result.*',
                '**/*$Result$*.*',
                // adapters generated by moshi
                '**/*JsonAdapter.*',
                // Hilt
                '**/*Module.kt',
                '**/di/**',
                'dagger.hilt.internal/*',
                'hilt_aggregated_deps/*',

                '**/*$Result.*', /* filtering `sealed` and `data` classes */
                '**/*$Result$*.*',/* filtering `sealed` and `data` classes */
                '**/*Args*.*', /* filtering Navigation Component generated classes */
                '**/*Directions*.*', /* filtering Navigation Component generated classes */
                '**/*inlined*.class', /* filtering inlined classes */
                '**/composables/**'
                /* INSERT ANY OTHER JUNK YOU WANT FILTERED OUT HERE */
        ]

        final kotlinTree = fileTree(dir: project.layout.buildDirectory.dir("intermediates/built_in_kotlinc/${variant}/compile${buildType}Kotlin/classes"), excludes: fileFilter)
        final javacTree = fileTree(dir: project.layout.buildDirectory.dir("intermediates/javac/${variant}/compile${buildType}JavaWithJavac/classes"), excludes: fileFilter)

        final mainSrc = "${project.projectDir}/src/main/java"
        final buildTypeSrc = "${project.projectDir}/src/${variant}/java"

        sourceDirectories.setFrom files([mainSrc, buildTypeSrc])
        classDirectories.setFrom files([kotlinTree, javacTree])
        executionData.setFrom fileTree(dir: project.layout.buildDirectory, includes: [
                "outputs/unit_test_code_coverage/${variant}UnitTest/test${buildType}UnitTest.exec"
        ])
    }
}
