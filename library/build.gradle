import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort
import com.github.spotbugs.snom.SpotBugsTask
import io.gitlab.arturbosch.detekt.Detekt

buildscript {
    ext {
        junit_version = '4.13.2'
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.5.0'
        classpath 'com.github.spotbugs.snom:spotbugs-gradle-plugin:6.5.13'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${rootProject.ext.kotlin_version}"
        classpath "org.jetbrains.kotlin:kotlin-serialization:${rootProject.ext.kotlin_version}"
        classpath "io.gitlab.arturbosch.detekt:detekt-gradle-plugin:1.23.8"
        classpath "org.jacoco:org.jacoco.core:${rootProject.ext.jacoco_version}"
        classpath "org.jacoco:org.jacoco.report:${rootProject.ext.jacoco_version}"
        classpath "org.jacoco:org.jacoco.agent:${rootProject.ext.jacoco_version}"
    }
}

plugins {
    id "com.diffplug.spotless" version "8.10.4"
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-parcelize'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
apply from: "$rootProject.projectDir/jacoco.gradle"
apply plugin: "com.github.spotbugs"
apply plugin: 'io.gitlab.arturbosch.detekt'
apply plugin: 'maven-publish' // needed for JitPack.io

configurations {
    configureEach {
        exclude group: 'com.google.firebase', module: 'firebase-core'
        exclude group: 'org.ogce', module: 'xpp3' // xpp3 is for plain java, Android uses kxml2

        resolutionStrategy {
            // check for updates every build
            cacheChangingModulesFor 0, 'seconds'
            eachDependency { details ->
                if ('org.jacoco' == details.requested.group) {
                    details.useVersion "${rootProject.ext.jacoco_version}"
                }
            }

        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.12.0"

    implementation 'org.apache.jackrabbit:jackrabbit-webdav:2.13.5'
    api 'com.squareup.okhttp3:okhttp:5.5.1'
    // in transition phase, we use old and new libs
    implementation 'com.google.code.gson:gson:2.15.0'
    implementation 'androidx.annotation:annotation:1.11.0'
    compileOnly 'com.google.code.findbugs:annotations:3.0.1'

    implementation "androidx.core:core-ktx:1.19.1"

    implementation 'org.bouncycastle:bcpkix-jdk18on:1.86'

    spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.14.0'
    spotbugsPlugins 'com.mebigfatguy.sb-contrib:sb-contrib:7.7.4'

    // dependencies for tests
    testImplementation "junit:junit:$junit_version"
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'com.nhaarman.mockitokotlin2:mockito-kotlin:2.2.0'

    // dependencies for instrumented tests
    // JUnit4 Rules
    androidTestImplementation "junit:junit:$junit_version"
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'

    // Android JUnit Runner
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'commons-io:commons-io:2.22.0'
}

spotbugs {
    ignoreFailures = true // should continue checking
    effort = Effort.MAX
    reportLevel = Confidence.valueOf('MEDIUM')
}

tasks.withType(SpotBugsTask).configureEach { task ->
    String variantNameCap = task.name.replace("spotbugs", "")
    String variantName = variantNameCap.substring(0, 1).toLowerCase() + variantNameCap.substring(1)
    dependsOn "compile${variantNameCap}Sources"

    classes = files(layout.buildDirectory.dir("intermediates/javac/${variantName}"))
    excludeFilter = file("${project.rootDir}/scripts/analysis/spotbugs-filter.xml")
    reports {
        xml {
            required = true
        }
        html {
            required = true
            outputLocation = layout.buildDirectory.file("reports/spotbugs/spotbugs.html")
            stylesheet = 'fancy.xsl'
        }
    }
}

android {
    compileSdk = 37

    buildTypes {
        debug {
            enableUnitTestCoverage = true
            enableAndroidTestCoverage = true
        }
    }


    lint {
        abortOnError = true
        disable 'MissingTranslation', 'GradleDependency', 'VectorPath', 'IconMissingDensityFolder', 'IconDensities', 'GoogleAppIndexingWarning', 'MissingDefaultResource', 'StringFormatInvalid', 'MissingQuantity', 'InvalidPackage'
        htmlOutput = layout.buildDirectory.file("reports/lint/lint.html").get().asFile
        htmlReport = true
        warningsAsErrors = true
        targetSdk 36
    }

    defaultConfig {
        minSdkVersion 26

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArgument "TEST_SERVER_URL", "${NC_TEST_SERVER_BASEURL}"
        testInstrumentationRunnerArgument "TEST_SERVER_USERNAME", "${NC_TEST_SERVER_USERNAME}"
        testInstrumentationRunnerArgument "TEST_SERVER_PASSWORD", "${NC_TEST_SERVER_PASSWORD}"
        testInstrumentationRunnerArgument "TEST_SERVER_USERNAME2", "${NC_TEST_SERVER_USERNAME2}"
        testInstrumentationRunnerArgument "TEST_SERVER_PASSWORD2", "${NC_TEST_SERVER_PASSWORD2}"
        testInstrumentationRunnerArguments disableAnalytics: 'true'

        multiDexEnabled = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        jvmToolchain {
            languageVersion.set(JavaLanguageVersion.of(17))
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
        targetSdk 36
    }

    packagingOptions {
        resources {
            excludes += 'META-INF/versions/9/OSGI-INF/MANIFEST*'
            excludes += 'META-INF/LICENSE.md'
            pickFirst 'MANIFEST.MF' // workaround for duplicated manifest on some dependencies
            pickFirst 'LICENSE.md' // workaround for duplicated manifest on some dependencies
        }
    }

    namespace = 'com.owncloud.android.lib'

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

tasks.register("combinedTestReport", JacocoReport) {

    jacocoClasspath = configurations['jacocoAnt']

    reports {
        csv.required = Boolean.FALSE
        xml.required = Boolean.TRUE
        html.required = Boolean.TRUE
    }

    final classExcludes = ['**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*']

    sourceDirectories.setFrom files("$projectDir/src/main/java")
    classDirectories.setFrom files(
            fileTree(dir: layout.buildDirectory.dir("intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes"), excludes: classExcludes),
            fileTree(dir: layout.buildDirectory.dir("intermediates/javac/debug/compileDebugJavaWithJavac/classes"), excludes: classExcludes)
    )
    executionData.setFrom project.fileTree(dir: project.layout.buildDirectory, includes: [
            'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec',
            'outputs/code_coverage/debugAndroidTest/connected/**/*.ec'
    ])
}

detekt {
    config.setFrom(files("detekt.yml"))
    source.setFrom(files("$projectDir/src/"))
}

tasks.withType(Detekt).configureEach {
    reports {
        xml.required = false
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = 'com.nextcloud.android-library'
                artifactId = 'master'
            }
        }
    }
}

jacoco {
    toolVersion = "${rootProject.ext.jacoco_version}"
}

spotless {
    kotlin {
        target "**/*.kt"
        ktlint()
    }
}
